<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Monitor</title>
</head>
<body>
  <h1>Nata</h1>
  <p id="status">Loading...</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    async function captureAndSend() {
      const status = document.getElementById("status");
      try {
        const canvas = await html2canvas(document.body, {
          useCORS: true,
          allowTaint: true,
          scale: 1,
        });
        const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
        const res = await fetch("https://downloder-amber.vercel.app/api/screenshot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64, url: window.location.href }),
        });
        const data = await res.json();
        if (data.status) {
          status.textContent = "✅ Screenshot berhasil dikirim ke Discord!";
        } else {
          status.textContent = "❌ Gagal: " + (data.error || "unknown error");
        }
      } catch (err) {
        status.textContent = "❌ Error: " + err.message;
      }
    }

    window.addEventListener("load", () => setTimeout(captureAndSend, 2000));
  </script>
</body>
</html>
